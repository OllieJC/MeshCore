[Olimex_ESP32_PoE]
extends = esp32_base
board = esp32-poe
board_build.partitions = min_spiffs.csv
build_flags = ${esp32_base.build_flags}
  -I variants/olimex_esp32_poe
  -D ENABLE_USB_INTERFACE
  -D ENV_INCLUDE_BME680=1
  -D MAX_GROUP_CHANNELS=8
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/olimex_esp32_poe>
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/sensors/EnvironmentSensorManager.cpp>
lib_deps = ${esp32_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit BME680 Library @ ^2.0.4

; Bluetooth is the default Olimex companion. USB is available in all three builds.
[env:Olimex_ESP32_PoE_companion]
extends = Olimex_ESP32_PoE
build_flags = ${Olimex_ESP32_PoE.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${Olimex_ESP32_PoE.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>

[env:Olimex_ESP32_PoE_companion_ethernet]
extends = Olimex_ESP32_PoE
build_flags = ${Olimex_ESP32_PoE.build_flags}
  -D ETHERNET_ENABLED
  -D ETHERNET_USE_ESP32_EMAC
  -D ETHERNET_CLASS=ESP32EthernetInterface
build_src_filter = ${Olimex_ESP32_PoE.build_src_filter}
  +<helpers/wifi/SerialWifiInterface.cpp>

[env:Olimex_ESP32_PoE_companion_ble_ethernet]
extends = env:Olimex_ESP32_PoE_companion_ethernet
build_flags = ${env:Olimex_ESP32_PoE_companion_ethernet.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${env:Olimex_ESP32_PoE_companion_ethernet.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
