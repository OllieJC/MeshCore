[env:Xiao_S3_WIO_m7ojc_sensor]
extends = Xiao_S3_WIO
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  -<helpers/ui/>
  +<helpers/ntp/NtpClock.cpp>
  +<../examples/simple_sensor/SensorMesh.cpp>
  +<../examples/m7ojc_sensor/*.cpp>
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -D ADVERT_NAME='"M7OJC Sensor"'
  -D SENSOR_PUBLIC_TELEMETRY=1
  -D SENSOR_DISABLE_TIME_SERIES
  -D ENV_INCLUDE_PMSA003I=1
  -D ENV_INCLUDE_SCD41=1
  -D ENV_INCLUDE_MICS6814=1
  -D TELEM_MICS6814_ADDRESS=0x18
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  ${esp32_ota.lib_deps}
  https://github.com/ZodiusInfuser/IOExpander_Library.git#d8c077dcfcd33407ef3a68c04f0c99035bee0a47
  adafruit/Adafruit PM25 AQI Sensor @ ^2.0.0
  Preferences
  knolleary/PubSubClient @ 2.8
